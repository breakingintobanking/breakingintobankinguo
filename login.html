<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In &middot; Recruiting Prep Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <h1>Recruiting Prep Hub</h1>
    <p id="login-message">Checking your sign-in status&hellip;</p>
    <button class="btn" id="signin-btn" style="display:none;">Sign in with University of Ottawa Account</button>
    <p class="login-error" id="login-error" style="display:none;"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="assets/auth.js"></script>
<script>
  (async () => {
    const messageEl = document.getElementById("login-message");
    const errorEl = document.getElementById("login-error");
    const signinBtn = document.getElementById("signin-btn");

    let instance;
    try {
      instance = await getMsalInstance();
    } catch (e) {
      document.querySelector(".login-card").innerHTML = `
        <h1>Sign-in isn't configured yet</h1>
        <p>Edit <code>content/auth-config.json</code> and set <code>clientId</code>
        to your Microsoft Entra app's Application (client) ID. See README.md for setup steps.</p>
      `;
      return;
    }

    try {
      const result = await instance.handleRedirectPromise();
      if (result && result.account) instance.setActiveAccount(result.account);
    } catch (e) {
      errorEl.textContent = "Sign-in failed: " + (e.errorMessage || e.message || e);
      errorEl.style.display = "block";
    }

    const account = getValidAccount(instance);
    if (account) {
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "index.html";
      location.href = next;
      return;
    }

    const anyAccount = instance.getAllAccounts()[0];
    if (anyAccount) {
      errorEl.textContent = "That account isn't a University of Ottawa account. Please sign in with your @uottawa.ca account.";
      errorEl.style.display = "block";
    }

    messageEl.textContent = "Sign in with your University of Ottawa account to continue.";
    signinBtn.style.display = "inline-block";
    signinBtn.addEventListener("click", () => {
      instance.loginRedirect({ scopes: ["User.Read"], prompt: "select_account" });
    });
  })();
</script>
</body>
</html>
